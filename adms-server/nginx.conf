# Nginx reverse proxy for Secureye / ZKTeco ADMS hardware
# IMPORTANT: Do NOT redirect /iclock/* from HTTP (port 80) to HTTPS (443)!
# Most biometric hardware firmware only supports plain HTTP on port 80 or 8080.

server {
    listen 80;
    server_name adms.yourdomain.com;

    # Allow raw text/plain payloads from biometric hardware
    client_max_body_size 5M;

    # Keep plain HTTP open specifically for ADMS push endpoints
    location /iclock/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # REST API & Live Monitor Dashboard
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
